<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>NCCL 프로세스 간 공유 메모리: /dev/shm 방식과 cuMem host 방식 비교</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6F6E68"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6FCF97"/></marker></defs>
<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#D3D1C7">NCCL 프로세스 간 공유 메모리 · 두 가지 방식</text>
<text x="360" y="48" text-anchor="middle" font-size="12" fill="#6F6E68">host = CPU 쪽 시스템 DRAM · 같은 노드의 두 프로세스가 같은 버퍼를 함께 본다</text>
<rect x="20" y="64" width="330" height="260" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="185" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">A  /dev/shm  (NCCL_CUMEM_HOST_ENABLE=0)</text>
<rect x="35" y="110" width="120" height="44" rx="6" fill="#1F1E1B" stroke="#6F6E68" stroke-width="1.2"/>
<text x="95.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Process A</text>
<rect x="215" y="110" width="120" height="44" rx="6" fill="#1F1E1B" stroke="#6F6E68" stroke-width="1.2"/>
<text x="275.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Process B</text>
<rect x="75" y="186" width="220" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="185.0" y="205.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">/dev/shm/nccl-xxxx</text>
<text x="185.0" y="221.0" text-anchor="middle" font-size="11" fill="#6F6E68">Linux가 관리하는 파일</text>
<rect x="75" y="260" width="220" height="44" rx="6" fill="#4A3A22" stroke="#FAC775" stroke-width="1.2"/>
<text x="185.0" y="279.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FAC775">Host DRAM</text>
<text x="185.0" y="295.0" text-anchor="middle" font-size="11" fill="#6F6E68">공유 버퍼</text>
<line x1="95" y1="156" x2="140" y2="184" stroke="#6F6E68" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="275" y1="156" x2="230" y2="184" stroke="#6F6E68" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="185" y="174" text-anchor="middle" font-size="11" fill="#6F6E68">같은 경로를 open</text>
<line x1="185" y1="232" x2="185" y2="258" stroke="#6FCF97" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="370" y="64" width="330" height="260" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="535" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">B  cuMem host  (NCCL 2.24+ 기본값)</text>
<rect x="385" y="110" width="120" height="44" rx="6" fill="#1F1E1B" stroke="#6F6E68" stroke-width="1.2"/>
<text x="445.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Process A</text>
<rect x="565" y="110" width="120" height="44" rx="6" fill="#1F1E1B" stroke="#6F6E68" stroke-width="1.2"/>
<text x="625.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Process B</text>
<line x1="507" y1="132" x2="563" y2="132" stroke="#6F6E68" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="535" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#D3D1C7">② 핸들(fd)</text>
<text x="535" y="148" text-anchor="middle" font-size="10" fill="#6F6E68">Unix socket</text>
<rect x="385" y="186" width="120" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="445.0" y="205.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">CUDA Driver</text>
<text x="445.0" y="221.0" text-anchor="middle" font-size="11" fill="#6F6E68">할당 · 핸들 발급</text>
<line x1="445" y1="156" x2="445" y2="184" stroke="#6F6E68" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="451" y="175" text-anchor="start" font-size="11" fill="#6F6E68">① 할당 요청</text>
<rect x="425" y="260" width="260" height="44" rx="6" fill="#4A3A22" stroke="#FAC775" stroke-width="1.2"/>
<text x="555.0" y="279.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FAC775">Host DRAM</text>
<text x="555.0" y="295.0" text-anchor="middle" font-size="11" fill="#6F6E68">pinned · NUMA 노드 지정</text>
<line x1="465" y1="232" x2="490" y2="258" stroke="#6FCF97" stroke-width="1.4" marker-end="url(#ahg)"/>
<line x1="625" y1="156" x2="625" y2="258" stroke="#6FCF97" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<text x="632" y="215" text-anchor="start" font-size="11" fill="#6F6E68">③ 핸들로</text>
<text x="632" y="229" text-anchor="start" font-size="11" fill="#6F6E68">매핑</text>
<text x="185" y="346" text-anchor="middle" font-size="11" fill="#888780">관리: Linux 파일 시스템</text>
<text x="535" y="346" text-anchor="middle" font-size="11" fill="#F08A8A">관리: CUDA Driver · NUMA가 막힌 컨테이너에서 실패 가능</text>
</svg>
