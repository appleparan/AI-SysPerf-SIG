<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>GPU_UTIL 95%라도 학습 효율은 다를 수 있다</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#B4B2A9"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#B4B2A9"/></marker></defs>
<rect x="20" y="20" width="330" height="250" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="36" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#D3D1C7">Case A · Batch Size 1</text>
<text x="36" y="64" text-anchor="start" font-size="12" fill="#B4B2A9">작은 GEMM · GPU 병렬성 부족</text>
<text x="40" y="100" text-anchor="start" font-size="12" fill="#B4B2A9">GPU_UTIL</text>
<text x="330" y="100" text-anchor="end" font-size="13" font-weight="700" fill="#D3D1C7">95%</text>
<rect x="40" y="108" width="290" height="22" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="108" width="275.5" height="22" rx="6" fill="#85B7EB"/>
<text x="40" y="158" text-anchor="start" font-size="12" fill="#B4B2A9">SM_ACTIVE</text>
<text x="330" y="158" text-anchor="end" font-size="13" font-weight="700" fill="#D3D1C7">20%</text>
<rect x="40" y="166" width="290" height="22" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="166" width="58" height="22" rx="6" fill="#F08A8A"/>
<text x="185" y="248" text-anchor="middle" font-size="12" fill="#B4B2A9">커널은 계속 실행되지만 일부 SM만 활용</text>
<rect x="370" y="20" width="330" height="250" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="386" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#D3D1C7">Case B · Batch Size 128</text>
<text x="386" y="64" text-anchor="start" font-size="12" fill="#B4B2A9">큰 GEMM · 더 많은 SM 활용 가능</text>
<text x="390" y="100" text-anchor="start" font-size="12" fill="#B4B2A9">GPU_UTIL</text>
<text x="680" y="100" text-anchor="end" font-size="13" font-weight="700" fill="#D3D1C7">95%</text>
<rect x="390" y="108" width="290" height="22" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<rect x="390" y="108" width="275.5" height="22" rx="6" fill="#85B7EB"/>
<text x="390" y="158" text-anchor="start" font-size="12" fill="#B4B2A9">SM_ACTIVE</text>
<text x="680" y="158" text-anchor="end" font-size="13" font-weight="700" fill="#D3D1C7">85%</text>
<rect x="390" y="166" width="290" height="22" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<rect x="390" y="166" width="246.5" height="22" rx="6" fill="#6FCF97"/>
<text x="535" y="248" text-anchor="middle" font-size="12" fill="#B4B2A9">Samples/sec와 Step Time으로 실제 효과 검증</text>
<text x="360" y="296" text-anchor="middle" font-size="11" fill="#888780">가상 수치(실측 아님) · GPU_UTIL ≠ SM 활용률 · Batch 증가 효과는 모델·커널에 따라 다름</text>
</svg>
