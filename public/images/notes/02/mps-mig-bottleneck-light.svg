<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
