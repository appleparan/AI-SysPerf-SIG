<text x="350" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">Compute Instance 1 (CI)</text>
<rect x="56" y="162" width="388" height="44" rx="6" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1.2"/>
<text x="250" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">Memory Slices · HBM / L2 / Memory Controllers</text>
<rect x="500" y="58" width="180" height="160" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<text x="590" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">GPU Instance 1</text>
<rect x="516" y="92" width="148" height="60" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="590" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">Compute Instance</text>
<rect x="516" y="162" width="148" height="44" rx="6" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1.2"/>
<text x="590" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">별도 HBM · L2 · MC</text>
<line x1="463" y1="130" x2="497" y2="130" stroke="#FAC775" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<line x1="480" y1="134" x2="480" y2="270" stroke="#FAC775" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="480" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#FAC775">다른 GI 사이: Memory Bandwidth QoS</text>
<path d="M56 226 V234 H444 V226" fill="none" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="250" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#D3D1C7">같은 GI의 CI 사이: 메모리·대역폭 공유</text>
<text x="360" y="352" text-anchor="middle" font-size="11" fill="#888780">Source: NVIDIA MIG User Guide · Concepts (A100 예시)</text>
