<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>GPU 결과를 CPU에서 취합하는 두 가지 방법</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#B4B2A9"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#F08A8A"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6FCF97"/></marker></defs>
<text x="360.0" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#D3D1C7">GPU 결과를 CPU에서 취합할 때</text>
<text x="360.0" y="48" text-anchor="middle" font-size="12" fill="#B4B2A9">GPU 결과의 최종 후처리는 CPU 0에서 수행한다고 가정</text>
<rect x="20" y="64" width="330" height="276" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="185.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">A  CPU 0 메모리에 수집</text>
<rect x="50" y="112" width="100" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="100.0" y="139.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">GPU 0</text>
<rect x="220" y="112" width="100" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="270.0" y="139.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">GPU 1</text>
<rect x="105" y="196" width="160" height="50" rx="6" fill="#4A3A22" stroke="#FAC775" stroke-width="1.2"/>
<text x="185.0" y="218.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FAC775">NUMA 0 DRAM</text>
<text x="185.0" y="235.0" text-anchor="middle" font-size="11" fill="#B4B2A9">Result 0 + 1</text>
<line x1="105" y1="158" x2="145" y2="194" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="265" y1="158" x2="225" y2="194" stroke="#F08A8A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="262" y="188" text-anchor="start" font-size="11" font-weight="700" fill="#F08A8A">원격 D2H</text>
<rect x="135" y="266" width="100" height="34" rx="6" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1.2"/>
<text x="185.0" y="288.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">CPU 0</text>
<line x1="185" y1="248" x2="185" y2="264" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="185" y="326" text-anchor="middle" font-size="11" fill="#888780">두 GPU 결과를 NUMA 0 DRAM에 수집</text>
<rect x="370" y="64" width="330" height="276" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="535.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">B  GPU에서 먼저 집계</text>
<rect x="400" y="112" width="100" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="450.0" y="139.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">GPU 0</text>
<rect x="570" y="112" width="100" height="44" rx="6" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.2"/>
<text x="620.0" y="139.0" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">GPU 1</text>
<rect x="400" y="186" width="100" height="34" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<text x="450.0" y="208.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Reduce</text>
<rect x="570" y="186" width="100" height="34" rx="6" fill="#1F1E1B" stroke="#888780" stroke-width="1.2"/>
<text x="620.0" y="208.0" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">Reduce</text>
<line x1="450" y1="158" x2="450" y2="184" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="620" y1="158" x2="620" y2="184" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="455" y="266" width="160" height="34" rx="6" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1.2"/>
<text x="535.0" y="288.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">CPU 최종 집계</text>
<line x1="450" y1="222" x2="500" y2="264" stroke="#B4B2A9" stroke-width="1" marker-end="url(#ah)"/>
<line x1="620" y1="222" x2="570" y2="264" stroke="#B4B2A9" stroke-width="1" marker-end="url(#ah)"/>
<text x="535" y="246" text-anchor="middle" font-size="11" fill="#B4B2A9">작은 결과</text>
<text x="535" y="326" text-anchor="middle" font-size="11" fill="#888780">부분 집계 후 작은 결과만 CPU로 전송</text>
<text x="360.0" y="370" text-anchor="middle" font-size="12" fill="#B4B2A9">GPU 1의 원격 D2H 비용과 CPU 전송량 감소 효과를 비교</text>
</svg>
