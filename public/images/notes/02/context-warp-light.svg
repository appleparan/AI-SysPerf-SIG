<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>CUDA Context와 Warp의 계층 관계</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5F5E5A"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#D64545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2E9E6B"/></marker></defs>
<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">CUDA Context와 Warp는 서로 다른 계층</text>
<rect x="20" y="44" width="680" height="130" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="360.0" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">CPU Process / CUDA Context</text>
<rect x="60" y="82" width="280" height="40" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.2"/>
<text x="200.0" y="107.0" text-anchor="middle" font-size="13" font-weight="700" fill="#854F0B">Process A · Context A</text>
<rect x="380" y="82" width="280" height="40" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.2"/>
<text x="520.0" y="107.0" text-anchor="middle" font-size="13" font-weight="700" fill="#854F0B">Process B · Context B</text>
<text x="360" y="152" text-anchor="middle" font-size="11" fill="#5F5E5A">각 Context: 메모리 할당 · 커널 코드 · Streams / Events</text>
<line x1="360" y1="176" x2="360" y2="226" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="372" y="206" text-anchor="start" font-size="12" fill="#5F5E5A">CUDA Driver에 Kernel 실행 요청 (Launch)</text>
<rect x="20" y="228" width="680" height="172" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="360.0" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">Physical GPU · Kernel 실행</text>
<rect x="40" y="262" width="200" height="76" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="140" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#185FA5">Thread Block 0 → Warps</text>
<rect x="48" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="79" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
