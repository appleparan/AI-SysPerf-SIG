<rect x="203" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="140" y="330" text-anchor="middle" font-size="10" fill="#5F5E5A">Warp</text>
<rect x="260" y="262" width="200" height="76" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="360" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#185FA5">Thread Block 1 → Warps</text>
<rect x="268" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="299" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="330" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="361" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="392" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="423" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="360" y="330" text-anchor="middle" font-size="10" fill="#5F5E5A">Warp</text>
<rect x="480" y="262" width="200" height="76" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="580" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#185FA5">Thread Block 2 → Warps</text>
<rect x="488" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="519" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="550" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="581" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="612" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="643" y="302" width="25" height="14" rx="2" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="580" y="330" text-anchor="middle" font-size="10" fill="#5F5E5A">Warp</text>
<text x="360" y="372" text-anchor="middle" font-size="12" fill="#5F5E5A">Block은 SM에 배치 · Warp Scheduler가 실행 가능한 Warp의 명령을 선택</text>
<rect x="20" y="420" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="126.0" y="441.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2A">Context는 실행 환경</text>
<rect x="254" y="420" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="360.0" y="441.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2A">Block은 SM 배치 단위</text>
<rect x="488" y="420" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="594.0" y="441.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2A">Warp는 SM 내부 실행 단위</text>
