<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>다이 2개가 NV-HBI로 묶여 하나의 CUDA GPU로 보이는 구조</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5F5E5A"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5F5E5A"/></marker></defs>
<rect x="20" y="20" width="600" height="170" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="36" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#2C2C2A">Blackwell GPU · 단일 CUDA GPU로 노출</text>
<rect x="50" y="65" width="220" height="100" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="160" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#185FA5">GPU Die 0</text>
<text x="160" y="130" text-anchor="middle" font-size="12" fill="#5F5E5A">SMs · L2 slices · Memory</text>
<rect x="370" y="65" width="220" height="100" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="480" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#185FA5">GPU Die 1</text>
<text x="480" y="130" text-anchor="middle" font-size="12" fill="#5F5E5A">SMs · L2 slices · Memory</text>
<rect x="270" y="97" width="100" height="36" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.2"/>
<text x="320" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#854F0B">NV-HBI</text>
<text x="320" y="126" text-anchor="middle" font-size="12" fill="#854F0B">10 TB/s</text>
<text x="320" y="214" text-anchor="middle" font-size="11" fill="#888780">Coherent interconnect · 하드웨어와 CUDA 런타임이 통합된 프로그래밍 모델을 제공</text>
</svg>
