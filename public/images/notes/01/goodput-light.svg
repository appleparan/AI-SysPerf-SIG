<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>GPU Utilization과 Goodput을 구분하는 세 관점</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5F5E5A"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5F5E5A"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#2C2C2A">GPU Utilization ≠ Goodput</text>
<rect x="20" y="48" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="34" y="72" text-anchor="start" font-size="12" fill="#888780">01</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="700" fill="#185FA5">SM Activity</text>
<text x="115" y="104" text-anchor="middle" font-size="12" fill="#5F5E5A">연산 자원이 실제로 얼마나</text>
<text x="115" y="124" text-anchor="middle" font-size="12" fill="#5F5E5A">활성화되어 있는가?</text>
<rect x="225" y="48" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="239" y="72" text-anchor="start" font-size="12" fill="#888780">02</text>
<text x="265" y="72" text-anchor="start" font-size="14" font-weight="700" fill="#185FA5">Latency Hiding</text>
<text x="320" y="104" text-anchor="middle" font-size="12" fill="#5F5E5A">메모리·연산 대기 시간을</text>
<text x="320" y="124" text-anchor="middle" font-size="12" fill="#5F5E5A">얼마나 숨길 수 있는가?</text>
<rect x="430" y="48" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="444" y="72" text-anchor="start" font-size="12" fill="#888780">03</text>
<text x="470" y="72" text-anchor="start" font-size="14" font-weight="700" fill="#185FA5">Bottleneck</text>
<text x="525" y="104" text-anchor="middle" font-size="12" fill="#5F5E5A">Memory-bound인가?</text>
<text x="525" y="124" text-anchor="middle" font-size="12" fill="#5F5E5A">Compute-bound인가?</text>
</svg>
