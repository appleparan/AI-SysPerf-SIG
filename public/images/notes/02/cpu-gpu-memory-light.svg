<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>CPU와 GPU의 메모리 관리 방식 비교</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5F5E5A"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#D64545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2E9E6B"/></marker></defs>
<text x="360.0" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">CPU와 GPU는 메모리를 어떻게 관리하는가?</text>
<text x="360.0" y="48" text-anchor="middle" font-size="12" fill="#5F5E5A">시스템 메모리는 Linux Kernel · GPU HBM은 CUDA Driver/Runtime을 통해 관리</text>
<rect x="20" y="64" width="330" height="302" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="185.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">CPU  ·  System DRAM</text>
<rect x="40" y="104" width="135" height="34" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="107.5" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">Process A</text>
<rect x="195" y="104" width="135" height="34" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="262.5" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">Process B</text>
<rect x="40" y="172" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="185.0" y="197.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">Linux Kernel + MMU</text>
<rect x="40" y="242" width="290" height="40" rx="6" fill="#E3F3EA" stroke="#2E9E6B" stroke-width="1.2"/>
<text x="185.0" y="267.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6B45">Physical Pages (DRAM)</text>
<line x1="107" y1="140" x2="107" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="263" y1="140" x2="263" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="185" y1="214" x2="185" y2="240" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="44" y="308" text-anchor="start" font-size="12" fill="#5F5E5A">• 페이지 단위 할당·매핑</text>
<text x="44" y="328" text-anchor="start" font-size="12" fill="#5F5E5A">• cgroups로 메모리 사용 제한</text>
<text x="44" y="348" text-anchor="start" font-size="12" fill="#5F5E5A">• reclaim / swap 지원</text>
<rect x="370" y="64" width="330" height="302" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="535.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">GPU  ·  HBM</text>
<rect x="390" y="104" width="135" height="34" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="457.5" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">CUDA Process A</text>
<rect x="545" y="104" width="135" height="34" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="612.5" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">CUDA Process B</text>
<rect x="390" y="172" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="535.0" y="197.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">CUDA Runtime / Driver</text>
<rect x="390" y="242" width="290" height="40" rx="6" fill="#DCEBFA" stroke="#378ADD" stroke-width="1.2"/>
<text x="535.0" y="267.0" text-anchor="middle" font-size="13" font-weight="700" fill="#185FA5">Device Allocations (HBM)</text>
<line x1="457" y1="140" x2="457" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="613" y1="140" x2="613" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="535" y1="214" x2="535" y2="240" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="394" y="308" text-anchor="start" font-size="12" fill="#5F5E5A">• 드라이버가 GPU 할당 추적</text>
<text x="394" y="328" text-anchor="start" font-size="12" fill="#5F5E5A">• 프로세스별 할당과 메모리 풀</text>
<text x="394" y="348" text-anchor="start" font-size="12" fill="#5F5E5A">• CPU cgroups로 HBM 직접 제한 불가</text>
<text x="360.0" y="392" text-anchor="middle" font-size="11" fill="#888780">핵심: 여러 CUDA Context는 같은 물리 HBM을 경쟁하지만, 서로의 할당 메모리를 자유롭게 접근하지는 못함</text>
</svg>
