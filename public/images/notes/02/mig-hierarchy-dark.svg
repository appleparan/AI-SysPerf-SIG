<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>MIG의 계층: GPU → GI → CI</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#B4B2A9"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#B4B2A9"/></marker></defs>
<rect x="20" y="20" width="680" height="310" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="36" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#D3D1C7">Physical GPU</text>
