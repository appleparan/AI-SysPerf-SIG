<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>기본 CUDA 공유와 MPS의 GPU 실행 방식 비교</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#B4B2A9"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#F08A8A"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6FCF97"/></marker></defs>
<text x="360.0" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#D3D1C7">기본 CUDA 공유 vs. MPS</text>
<text x="360.0" y="48" text-anchor="middle" font-size="12" fill="#B4B2A9">동일 GPU를 공유해도 Context 실행 방식은 다를 수 있음 · 개념도</text>
<rect x="20" y="64" width="330" height="240" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="185.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">일반적인 별도 Context</text>
<text x="185.0" y="106" text-anchor="middle" font-size="11" fill="#B4B2A9">Process A / Context A · Process B / Context B</text>
<rect x="50" y="128" width="60" height="40" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="80.0" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<rect x="110" y="128" width="60" height="40" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="140.0" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<rect x="170" y="128" width="14" height="40" rx="2" fill="#4A3A22" stroke="#FAC775" stroke-width="1"/>
<rect x="184" y="128" width="60" height="40" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="214.0" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<rect x="244" y="128" width="60" height="40" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="274.0" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<line x1="40" y1="178" x2="330" y2="178" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="40" y="200" text-anchor="start" font-size="11" fill="#B4B2A9">GPU 실행 시간 →</text>
<text x="177" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#FAC775">전환</text>
<text x="185" y="262" text-anchor="middle" font-size="12" fill="#B4B2A9">서로 다른 Context의 실행을 조정</text>
<text x="185" y="282" text-anchor="middle" font-size="12" fill="#B4B2A9">전환 오버헤드와 간섭 가능</text>
<rect x="370" y="64" width="330" height="240" rx="6" fill="#444441" stroke="#6F6E68" stroke-width="1.2"/>
<text x="535.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#D3D1C7">MPS 공유 실행</text>
<text x="535.0" y="106" text-anchor="middle" font-size="11" fill="#B4B2A9">Process A/B → MPS Server → GPU</text>
<rect x="415" y="120" width="60" height="38" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="445" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<rect x="475" y="120" width="60" height="38" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="505" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<rect x="535" y="120" width="60" height="38" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="565" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<rect x="595" y="120" width="60" height="38" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="625" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<rect x="415" y="164" width="60" height="38" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="445" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<rect x="475" y="164" width="60" height="38" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="505" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<rect x="535" y="164" width="60" height="38" rx="3" fill="#1F3A2C" stroke="#6FCF97" stroke-width="1"/>
<text x="565" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97">B</text>
<rect x="595" y="164" width="60" height="38" rx="3" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1"/>
<text x="625" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#85B7EB">A</text>
<line x1="390" y1="214" x2="680" y2="214" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="390" y="236" text-anchor="start" font-size="11" fill="#B4B2A9">GPU 실행 시간 →</text>
<text x="535" y="262" text-anchor="middle" font-size="12" fill="#B4B2A9">자원이 남고 동시 실행 조건이 맞을 때</text>
<text x="535" y="282" text-anchor="middle" font-size="12" fill="#B4B2A9">SM의 실행 자원을 효율적으로 활용</text>
<text x="360.0" y="330" text-anchor="middle" font-size="11" fill="#888780">주의: 실제 동시 실행은 커널의 자원 사용량·의존성·스케줄링에 따라 달라짐</text>
</svg>
