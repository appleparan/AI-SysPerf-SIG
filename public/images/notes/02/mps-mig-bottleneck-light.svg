<text x="634" y="278" text-anchor="middle" font-size="11" fill="#5F5E5A">slice</text>
<text x="396" y="330" text-anchor="start" font-size="12" fill="#5F5E5A">• 인스턴스별 HBM 대역폭 분할</text>
<text x="396" y="352" text-anchor="start" font-size="12" fill="#5F5E5A">• 서로 다른 GI 간 대역폭 간섭 완화</text>
<text x="360" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2A">MIG는 GPU 내부 대역폭을 격리하지만, 여러 서비스의 CPU 전처리·PCIe 전송 경쟁은 남는다</text>
