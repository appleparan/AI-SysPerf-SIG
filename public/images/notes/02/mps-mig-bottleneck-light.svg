<text x="190" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#185FA5">HBM 대역폭 · L2 · SM 공유</text>
<text x="40" y="330" text-anchor="start" font-size="12" fill="#5F5E5A">• 이미 HBM 포화라면 동시 실행 이득 제한</text>
<text x="40" y="352" text-anchor="start" font-size="12" fill="#5F5E5A">• P95/P99 지연 시간 상승 가능</text>
